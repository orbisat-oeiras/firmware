[package]
name = "orbisat-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
orbisat = { path = "../orbisat" }
orbisat-components = { path = "../orbisat-components" }
orbisat-firmware-config = { path = "../orbisat-firmware-config" }

orbipacket = { git = "https://github.com/orbisat-oeiras/orbipacket-rs.git", features = [
    "defmt",
] }

defmt = "1.0.1"

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["defmt-03"] }
embedded-sdmmc = { version = "0.9.0", default-features = false, features = [
    "defmt-log",
] }

esp-hal = { version = "1.0.0", features = ["defmt", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["defmt", "embassy"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt"] }
esp-backtrace = { version = "0.19.0", features = ["println", "panic-handler"] }
esp-println = { version = "0.17.0", features = ["defmt-espflash"] }
static_cell = "2.1.1"
paste = "1.0.15"

thiserror = { version = "2.0.18", default-features = false }

[features]
# Enable selection of ESP target
default = ["esp32s3"]
esp32 = [
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-backtrace/esp32",
    "esp-println/esp32",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
]
